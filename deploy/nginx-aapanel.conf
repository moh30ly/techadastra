# Extra nginx rules for techadastra.com on aaPanel.
#
# aaPanel → Website → techadastra.com → Conf. Paste the block below inside the
# `server { … }` for port 443, just ABOVE aaPanel's own
# `location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$` lines. Save — aaPanel runs
# `nginx -t` before reloading. If you edit the file by hand instead, test with
#   /www/server/nginx/sbin/nginx -t -c /www/server/nginx/conf/nginx.conf
# and reload with  /etc/init.d/nginx reload. Do NOT use `systemctl reload nginx`:
# on aaPanel boxes that controls a second, unused nginx install.

    index index.html;

    # Clean URLs: /en/programs/ → /en/programs/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Each language gets its own 404 page.
    error_page 404 /404.html;
    location ^~ /tr/ { try_files $uri $uri/ =404; error_page 404 /tr/404.html; }
    location ^~ /de/ { try_files $uri $uri/ =404; error_page 404 /de/404.html; }
    location ^~ /en/ { try_files $uri $uri/ =404; error_page 404 /en/404.html; }

    # The settings file is edited on the server, so browsers must always re-check it.
    # (Exact match outranks aaPanel's 12h cache rule for .js files.)
    location = /assets/config.js {
        expires -1;
    }

    # CSS/JS/images are fingerprinted with ?v=<build>, so they can be cached long.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
