# nginx for the Docker stack — same behaviour as deploy/nginx-aapanel.conf,
# plus /api/ proxied to the contact-form API container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location ^~ /tr/ { try_files $uri $uri/ =404; error_page 404 /tr/404.html; }
    location ^~ /de/ { try_files $uri $uri/ =404; error_page 404 /de/404.html; }
    location ^~ /en/ { try_files $uri $uri/ =404; error_page 404 /en/404.html; }

    location = /assets/config.js {
        expires -1;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }
}
