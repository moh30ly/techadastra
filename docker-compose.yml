# Local / self-hosted stack for techadastra.com:
#   web  nginx serving the built site, proxying /api/ → api
#   api  contact-form API (stores enquiries in MariaDB — or Postgres, see DATABASE_URL)
#   db   MariaDB 11.4
#
#   cp .env.example .env   # set passwords
#   docker compose up -d --build
#   open http://localhost:8484
#
# To use an existing database instead of the bundled one, set DATABASE_URL in .env
# and start only web + api:  docker compose up -d --build web api

# Fixed project name: containers, network and volume are always techadastra-*,
# whatever the folder is called, so they never mix with other stacks on the host.
name: techadastra

services:
  web:
    build: .
    image: techadastra-web
    ports:
      - "${WEB_PORT:-8484}:80"
    volumes:
      # Edit settings without rebuilding.
      - ./src/assets/config.js:/usr/share/nginx/html/assets/config.js:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    image: techadastra-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://adastra:${DB_PASSWORD:-adastra}@db:3306/adastra}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    extra_hosts:
      # Lets DATABASE_URL point at a database on the Docker host (e.g. aaPanel's MariaDB).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: adastra
      MARIADB_USER: adastra
      MARIADB_PASSWORD: ${DB_PASSWORD:-adastra}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mariadb-data:
